{% for image in images %}
<div class="image-card card bg-base-100 shadow-xl hover:shadow-2xl overflow-hidden group animate-scale-in"
     style="animation-delay: {{ forloop.counter0|add:1 }} * 50ms">
    <!-- Image Container -->
    <figure class="relative aspect-square overflow-hidden cursor-pointer"
            onclick="openLightbox('{{ image.image.url }}', '{{ image.caption|escapejs }}', {{ image.pk }})">
        <img src="{{ image.image.url }}" 
             alt="{{ image.caption }}"
             loading="lazy"
             class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110" />
        
        <!-- Overlay on hover -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <div class="absolute bottom-0 left-0 right-0 p-4">
                <p class="text-white font-medium truncate">{{ image.caption|default:"No caption" }}</p>
                <div class="flex items-center gap-2 text-xs text-white/80 mt-1">
                    <span>{{ image.width }}x{{ image.height }}</span>
                    <span>•</span>
                    <span>{{ image.file_size_mb }} MB</span>
                </div>
            </div>
        </div>
        
        <!-- Badge for image type -->
        {% if image.is_landscape %}
        <div class="absolute top-2 right-2 badge badge-primary opacity-0 group-hover:opacity-100 transition-opacity">
            📐 Landscape
        </div>
        {% elif image.is_portrait %}
        <div class="absolute top-2 right-2 badge badge-secondary opacity-0 group-hover:opacity-100 transition-opacity">
            📐 Portrait
        </div>
        {% endif %}
    </figure>
    
    <!-- Card Actions -->
    <div class="card-actions justify-between p-4 bg-base-200/50">
        <div class="text-xs opacity-60">
            {{ image.uploaded_at|date:"M d, Y" }}
        </div>
        <div class="flex gap-2">
            <button class="btn btn-ghost btn-xs" 
                    onclick="openLightbox('{{ image.image.url }}', '{{ image.caption|escapejs }}', {{ image.pk }})"
                    title="View">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>
            <a href="{{ image.image.url }}" download class="btn btn-ghost btn-xs" title="Download">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            </a>
            <button class="btn btn-ghost btn-xs text-error" 
                    onclick="confirmDelete({{ image.pk }})"
                    title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
        </div>
    </div>
</div>
{% empty %}
{% if search_query %}
<div class="col-span-full text-center py-16">
    <div class="text-6xl mb-4">🔍</div>
    <h3 class="text-2xl font-bold mb-2">No results found</h3>
    <p class="opacity-70">No images found for "<strong>{{ search_query }}</strong>"</p>
</div>
{% else %}
<div class="col-span-full text-center py-16">
    <div class="text-6xl mb-4">📷</div>
    <h3 class="text-2xl font-bold mb-2">No images yet</h3>
    <p class="opacity-70">Be the first to upload!</p>
</div>
{% endif %}
{% endfor %}

<script>
function confirmDelete(pk) {
    if (confirm('Are you sure you want to delete this image? This action cannot be undone.')) {
        fetch(`/image/${pk}/delete/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCsrfToken(),
                'HX-Request': 'true'
            }
        }).then(() => {
            document.dispatchEvent(new CustomEvent('galleryUpdated'));
        });
    }
}

function getCsrfToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
           document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
}
</script>
