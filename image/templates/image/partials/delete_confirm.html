<!-- Delete Confirmation Partial -->
<div class="p-4">
    <h3 class="text-lg font-bold mb-2">Delete Image?</h3>
    <p class="mb-4">Are you sure you want to delete "<strong>{{ image.caption }}</strong>"? This action cannot be undone.</p>
    
    <div class="flex gap-2">
        <form method="post" action="{% url 'delete' image.pk %}" class="flex-1">
            {% csrf_token %}
            <button type="submit" class="btn btn-error w-full">
                Delete
            </button>
        </form>
        <button class="btn btn-ghost flex-1" onclick="window.location.reload()">Cancel</button>
    </div>
</div>
