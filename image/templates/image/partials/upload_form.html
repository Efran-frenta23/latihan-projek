<form hx-post="{% url 'upload' %}" 
      hx-encoding="multipart/form-data"
      hx-target="#upload-form-container"
      hx-swap="outerHTML"
      enctype="multipart/form-data"
      class="space-y-4"
      id="upload-form">
    {% csrf_token %}
    
    <!-- Drag & Drop Zone -->
    <div class="form-control">
        <label class="label">
            <span class="label-text font-medium">Image File</span>
        </label>
        <div class="border-2 border-dashed border-base-300 rounded-lg p-8 text-center transition-all duration-300 hover:border-primary/50"
             id="drop-zone"
             @dragover.prevent="document.getElementById('drop-zone').classList.add('drag-active')"
             @dragleave="document.getElementById('drop-zone').classList.remove('drag-active')"
             @drop.prevent="handleDrop(event)">
            
            <!-- Preview Container -->
            <div id="preview-container" class="hidden mb-4">
                <img id="image-preview" class="max-h-48 mx-auto rounded-lg shadow-lg" alt="Preview" />
                <button type="button" 
                        onclick="resetFileInput()" 
                        class="btn btn-xs btn-error mt-2">
                    Remove
                </button>
            </div>
            
            <!-- Upload Icon & Text -->
            <div id="upload-prompt">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p class="text-sm mb-2">
                    <span class="font-medium text-primary">Click to upload</span> or drag and drop
                </p>
                <p class="text-xs opacity-60">
                    PNG, JPG, GIF, WEBP (max 5MB)
                </p>
            </div>
            
            <!-- Hidden File Input -->
            <input type="file" 
                   name="image" 
                   id="id_image" 
                   accept="image/*"
                   class="hidden"
                   onchange="handleFileSelect(event)" />
            <input type="file" 
                   name="image" 
                   id="file-input-hidden" 
                   accept="image/*"
                   class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                   onchange="handleFileSelect(event)" />
        </div>
        
        <!-- File size warning -->
        <label class="label">
            <span class="label-text-alt text-error" id="file-error"></span>
        </label>
    </div>
    
    <!-- Caption Field -->
    <div class="form-control">
        <label class="label">
            <span class="label-text font-medium">Caption <span class="opacity-50">(optional)</span></span>
        </label>
        <input type="text" 
               name="caption" 
               id="id_caption" 
               placeholder="Add a description..." 
               maxlength="200"
               class="input input-bordered w-full"
               value="{{ form.caption.value|default:'' }}" />
        <label class="label">
            <span class="label-text-alt" id="caption-length">0/200</span>
        </label>
    </div>
    
    <!-- Form Errors -->
    {% if form.errors %}
    <div class="alert alert-error">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <ul class="text-sm">
            {% for field, errors in form.errors.items %}
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            {% endfor %}
        </ul>
    </div>
    {% endif %}
    
    <!-- Submit Button -->
    <div class="form-control mt-6">
        <button type="submit" class="btn btn-primary gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            Upload Image
        </button>
    </div>
    
    <!-- Success Message (shown after upload via htmx) -->
    <div id="upload-success" class="hidden alert alert-success">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Image uploaded successfully!</span>
    </div>
</form>

<script>
// File preview functionality
function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
        showPreview(file);
    }
}

function handleDrop(event) {
    document.getElementById('drop-zone').classList.remove('drag-active');
    const file = event.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        // Set the file to the input
        const input = document.getElementById('id_image');
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        input.files = dataTransfer.files;
        showPreview(file);
    }
}

function showPreview(file) {
    // Validate file size (5MB)
    const maxSize = 5 * 1024 * 1024;
    if (file.size > maxSize) {
        document.getElementById('file-error').textContent = 'File size must be less than 5MB';
        return;
    }
    
    document.getElementById('file-error').textContent = '';
    document.getElementById('upload-prompt').classList.add('hidden');
    document.getElementById('preview-container').classList.remove('hidden');
    
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('image-preview').src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function resetFileInput() {
    document.getElementById('id_image').value = '';
    document.getElementById('preview-container').classList.add('hidden');
    document.getElementById('upload-prompt').classList.remove('hidden');
    document.getElementById('file-error').textContent = '';
}

// Caption character counter
document.getElementById('id_caption')?.addEventListener('input', function(e) {
    const length = e.target.value.length;
    document.getElementById('caption-length').textContent = `${length}/200`;
    if (length > 200) {
        document.getElementById('caption-length').classList.add('text-error');
    } else {
        document.getElementById('caption-length').classList.remove('text-error');
    }
});

// HTMX events
document.body.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail.target.id === 'upload-form-container') {
        // Check if upload was successful (form replaced with new form)
        const successDiv = document.getElementById('upload-success');
        if (successDiv && !successDiv.classList.contains('hidden')) {
            setTimeout(() => {
                document.getElementById('upload_modal').close();
                document.dispatchEvent(new CustomEvent('galleryUpdated'));
            }, 1000);
        }
    }
});
</script>
