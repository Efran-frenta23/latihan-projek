<!-- Mobile Search Modal -->
<dialog id="mobile_search" class="modal">
    <div class="modal-box">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <h3 class="font-bold text-lg mb-4">Search Images</h3>
        <form hx-get="{% url 'search' %}" hx-target="#gallery-grid" hx-push-url="true">
            <input 
                type="text" 
                name="q" 
                placeholder="Search..." 
                class="input input-bordered w-full"
                value="{{ search_form.q.value|default:'' }}"
                autocomplete="off"
            />
            <button type="submit" class="btn btn-primary w-full mt-4">Search</button>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<!-- Upload Modal -->
<dialog id="upload_modal" class="modal">
    <div class="modal-box">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <h3 class="font-bold text-lg mb-4">Upload Image</h3>
        <div id="upload-form-container">
            {% include "image/partials/upload_form.html" %}
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
